<!-- 
 what is a form in html

 form ek aisa structure hota jiska eklota kaam hai data ko collect krna

 form tag use krke aap form create krte hai

input tag use krke aap input field create krte hai
input tag ke andar type attribute use krke aap input field ka type set krte hai
jaise ki text, password, email, number, date, time, checkbox, radio button
input tag ke andar name attribute use krke aap input field ka name set krte hai
input tag ke andar placeholder attribute use krke aap input field ka placeholder set krte hai
input tag ke andar value attribute use krke aap input field ka value set krte hai
input tag ke andar required attribute use krke aap input field ko required bana sakte hai

label tag use krke aap input field ka label set krte hai
label tag ke andar for attribute use krke aap input field ka id set krte hai
select tag use krke aap dropdown create krte hai

har label ke andr for attribute use krke aap input field ka id set krte hai
option tag use krke aap dropdown ke options set krte hai

radio button aur checkbox ke liye bhi label tag use hota hai
radio button ke liye input tag ke andar type attribute ko radio set krte hai
checkbox ke liye input tag ke andar type attribute ko checkbox set krte hai
submit button ke liye input tag ke andar type attribute ko submit set krte hai
reset button ke liye input tag ke andar type attribute ko reset set krte hai
form tag ke andar action attribute use krke aap form ka action set krte hai

type specify krne se input field ka type set hota hai
jaise agr mujhe date likhni hai toh ek dialogue box open hoga jisme mujhe date select karni hogi
aur fir mujhe date select karne ke baad wo date input field me set ho jayegi

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="email">Enter Email ID: </label>
        <input type="text" id = "email">
        
        <br><br>

        <label for="password">Enter Password: </label>
        <input type="text" id = "password"> 
        <br><br>

        <input type="submit" value="Click Here">
        
    </form>

    <form action="">
        <label for="name">Enter Name: </label>
        <input type="text" id = "name" placeholder="Enter your name">
        <br><br>

        <label for="age">Enter Age: </label>
        <input type="number" id = "age" placeholder="Enter your age">
        <br><br>

        <label for="dob">Enter Date of Birth: </label>
        <input type="date" id = "dob">
        <br><br>

        <label for="time">Enter Time: </label>
        <input type="time" id = "time">
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    
</body>
</html>
